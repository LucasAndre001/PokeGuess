<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeGuess</title>
    <link rel="icon" href="./Favicons/favicon-16x16.png">
    <link rel="stylesheet" href="./Style/style.css">
    <script type="module" defer src="./Script/script.js"></script>
</head>
<body>
    <main>
        <img id="pokemonImage" src="#" alt="gif pokemon" class="pokemonImage">
        <img src="./Images/pokedex.svg" alt="Pokedex" class="pokedex"> 

        <div class="container">
            <h4 id="result" class="header"> Quem é esse <br> Pokemon?</h4>
        </div>

        <div id="options" class="options-container">
            <button>charizard</button>
            <button>pikachu</button>
            <button>nidoran</button>
            <button>bulbasaur</button>
        </div>
        <div>
            <h4 id="points"><span id="pointsValue">0</span></h4>
        </div>
        <div>
            <h4 id="mistakes"><span id="mistakesValue">0</span></h4>
        </div>
    </main>   
</body>
</html>
